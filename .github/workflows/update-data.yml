name: Actualiser les donnees locales CSP

on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Telecharger les donnees officielles
        shell: bash
        run: |
          set -euo pipefail
          download() {
            local url="$1" output="$2" temporary="${2}.tmp"
            if curl --fail --silent --show-error --location --retry 1 --retry-delay 2 --max-time 60 "$url" -o "$temporary"; then
              mv "$temporary" "$output"
              echo "OK $output"
            else
              rm -f "$temporary"
              echo "AVERTISSEMENT: source indisponible, ancienne version conservee: $output"
            fi
          }
          download 'https://opendata.doubs.fr/api/explore/v2.1/catalog/datasets/sdis25-centres-de-secours-du-doubs/exports/geojson' csp-doubs.geojson
          download 'https://framacarte.org/map/78971/download/' /tmp/cis-framacarte.json
          if [ -s /tmp/cis-framacarte.json ]; then
            jq '{type:"FeatureCollection",features:[.layers[].features[]]}' /tmp/cis-framacarte.json > cis-framacarte.geojson
          fi

          echo "Les donnees OSM nationales sont optionnelles et ne bloquent pas cette mise a jour."

      - name: Publier les changements
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cis-framacarte.geojson csp-doubs.geojson
          git diff --cached --quiet || git commit -m 'Actualiser les donnees CSP'
          git push
