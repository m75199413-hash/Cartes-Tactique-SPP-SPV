name: Actualiser les donnees locales CSP et PEI

on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Telecharger les donnees officielles
        shell: bash
        run: |
          set -euo pipefail
          download() {
            local url="$1" output="$2" temporary="${2}.tmp"
            if curl --fail --silent --show-error --location --retry 1 --retry-delay 2 --max-time 60 "$url" -o "$temporary"; then
              mv "$temporary" "$output"
              echo "OK $output"
            else
              rm -f "$temporary"
              echo "AVERTISSEMENT: source indisponible, ancienne version conservee: $output"
            fi
          }
          download 'https://opendata.doubs.fr/api/explore/v2.1/catalog/datasets/sdis25-centres-de-secours-du-doubs/exports/geojson' csp-doubs.geojson
          download 'https://data.rennesmetropole.fr/api/explore/v2.1/catalog/datasets/deci-pei/exports/geojson' pei-rennes.geojson
          download 'https://carto-sdis81.tigeo.fr/index.php/lizmap/service?repository=public&project=PEI_Hydraclic&SERVICE=WFS&typeName=pei_hydraclic_v2&VERSION=1.3.0&REQUEST=GetFeature&OutputFormat=geojson' pei-tarn.geojson
          download 'https://www.herault-data.fr/api/explore/v2.1/catalog/datasets/points-deau-defense-des-forets-contre-les-incendies-dfci-herault/exports/geojson' pei-herault-dfci.geojson
          download 'https://static.data.gouv.fr/resources/points-deau-incendie-de-lagglomeration-du-grand-annecy/20250128-081713/points-eau-incendie-2024.csv' pei-annecy.csv
          download 'https://www.pigma.org/fr/dataset/datasets/7554/resource/15478/download/' pei-sdis64.geojson
          download 'https://data.tours-metropole.fr/api/explore/v2.1/catalog/datasets/points-d-eau-tours-metropole-val-de-loire/exports/geojson' pei-tours.geojson
          download 'https://framacarte.org/map/78971/download/' /tmp/cis-framacarte.json
          if [ -s /tmp/cis-framacarte.json ]; then
            jq '{type:"FeatureCollection",features:[.layers[].features[]]}' /tmp/cis-framacarte.json > cis-framacarte.geojson
          fi

          echo "Les donnees OSM nationales sont optionnelles et ne bloquent pas cette mise a jour."

      - name: Publier les changements
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cis-framacarte.geojson csp-doubs.geojson pei-rennes.geojson pei-tarn.geojson pei-herault-dfci.geojson pei-annecy.csv pei-sdis64.geojson pei-tours.geojson
          git diff --cached --quiet || git commit -m 'Actualiser les donnees CSP et PEI'
          git push
