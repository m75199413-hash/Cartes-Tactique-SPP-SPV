name: Actualiser les donnees CSP et PEI

on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Telecharger les donnees officielles
        shell: bash
        run: |
          set -euo pipefail
          download() {
            local url="$1" output="$2" temporary="${2}.tmp"
            if curl --fail --silent --show-error --location --retry 1 --retry-delay 2 --max-time 60 "$url" -o "$temporary"; then
              mv "$temporary" "$output"
              echo "OK $output"
            else
              rm -f "$temporary"
              echo "AVERTISSEMENT: source indisponible, ancienne version conservee: $output"
            fi
          }
          download 'https://opendata.doubs.fr/api/explore/v2.1/catalog/datasets/sdis25-centres-de-secours-du-doubs/exports/geojson' csp-doubs.geojson
          download 'https://data.rennesmetropole.fr/api/explore/v2.1/catalog/datasets/deci-pei/exports/geojson' pei-rennes.geojson
          download 'https://carto-sdis81.tigeo.fr/index.php/lizmap/service?repository=public&project=PEI_Hydraclic&SERVICE=WFS&typeName=pei_hydraclic_v2&VERSION=1.3.0&REQUEST=GetFeature&OutputFormat=geojson' pei-tarn.geojson
          download 'https://www.herault-data.fr/api/explore/v2.1/catalog/datasets/points-deau-defense-des-forets-contre-les-incendies-dfci-herault/exports/geojson' pei-herault-dfci.geojson
          download 'https://static.data.gouv.fr/resources/points-deau-incendie-de-lagglomeration-du-grand-annecy/20250128-081713/points-eau-incendie-2024.csv' pei-annecy.csv
          download 'https://www.pigma.org/fr/dataset/datasets/7554/resource/15478/download/' pei-sdis64.geojson
          download 'https://data.tours-metropole.fr/api/explore/v2.1/catalog/datasets/points-d-eau-tours-metropole-val-de-loire/exports/geojson' pei-tours.geojson
          download 'https://framacarte.org/map/78971/download/' /tmp/cis-framacarte.json
          if [ -s /tmp/cis-framacarte.json ]; then
            jq '{type:"FeatureCollection",features:[.layers[].features[]]}' /tmp/cis-framacarte.json > cis-framacarte.geojson
          fi

          boxes=('41,-5.5,44.4,-0.8' '41,-0.8,44.4,3.9' '41,3.9,44.4,8.5' '44.4,-5.5,47.8,-0.8' '44.4,-0.8,47.8,3.9' '44.4,3.9,47.8,8.5' '47.8,-5.5,51.3,-0.8' '47.8,-0.8,51.3,3.9' '47.8,3.9,51.3,8.5')
          mkdir -p /tmp/pei-osm /tmp/commandement-osm
          query_overpass() {
            local query="$1"
            local output="$2"
            if ! curl --fail --silent --show-error --location --max-time 45 --retry 1 --retry-delay 2 --get \
              --data-urlencode "data=$query" 'https://overpass-api.de/api/interpreter' -o "$output"; then
              curl --fail --silent --show-error --location --max-time 45 --retry 1 --retry-delay 2 --get \
                --data-urlencode "data=$query" 'https://overpass.kumi.systems/api/interpreter' -o "$output" || rm -f "$output"
            fi
          }
          for i in "${!boxes[@]}"; do
            query_overpass \
              "[out:json][timeout:40];(nwr[\"emergency\"=\"fire_hydrant\"](${boxes[$i]});nwr[\"emergency\"=\"water_tank\"](${boxes[$i]});nwr[\"emergency\"=\"fire_water_pond\"](${boxes[$i]}););out center tags;" \
              "/tmp/pei-osm/$i.json" &
            query_overpass \
              "[out:json][timeout:40];nwr[\"name\"~\"CTA|CODIS|etat-major|état-major|centre opérationnel\",i](${boxes[$i]});out center tags;" \
              "/tmp/commandement-osm/$i.json" &
          done
          wait
          valid_json() { jq empty "$1" >/dev/null 2>&1; }
          pei_files=(); commandement_files=();
          for file in /tmp/pei-osm/*.json; do valid_json "$file" && pei_files+=("$file"); done
          for file in /tmp/commandement-osm/*.json; do valid_json "$file" && commandement_files+=("$file"); done
          if ((${#pei_files[@]})); then
            jq -s '{type:"FeatureCollection",features:[.[].elements[] | (.lat // .center.lat) as $lat | (.lon // .center.lon) as $lon | select($lat != null and $lon != null) | {type:"Feature",geometry:{type:"Point",coordinates:[$lon,$lat]},properties:(.tags // {})}]}' "${pei_files[@]}" > pei-france.geojson
          else
            printf '{"type":"FeatureCollection","features":[]}' > pei-france.geojson
          fi
          if ((${#commandement_files[@]})); then
            jq -s '{type:"FeatureCollection",features:[.[].elements[] | (.lat // .center.lat) as $lat | (.lon // .center.lon) as $lon | select($lat != null and $lon != null) | {type:"Feature",geometry:{type:"Point",coordinates:[$lon,$lat]},properties:(.tags // {})}]}' "${commandement_files[@]}" > commandement-france.geojson
          else
            printf '{"type":"FeatureCollection","features":[]}' > commandement-france.geojson
          fi

      - name: Publier les changements
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cis-framacarte.geojson commandement-france.geojson pei-france.geojson csp-doubs.geojson pei-rennes.geojson pei-tarn.geojson pei-herault-dfci.geojson pei-annecy.csv pei-sdis64.geojson pei-tours.geojson
          git diff --cached --quiet || git commit -m 'Actualiser les donnees CSP et PEI'
          git push
