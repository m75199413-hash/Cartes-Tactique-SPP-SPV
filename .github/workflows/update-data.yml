name: Actualiser les donnees CSP et PEI

on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Telecharger les donnees officielles
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --max-time 120 \
            'https://opendata.doubs.fr/api/explore/v2.1/catalog/datasets/sdis25-centres-de-secours-du-doubs/exports/geojson' \
            -o csp-doubs.geojson
          curl --fail --location --retry 3 --max-time 120 \
            'https://data.rennesmetropole.fr/api/explore/v2.1/catalog/datasets/deci-pei/exports/geojson' \
            -o pei-rennes.geojson
          curl --fail --location --retry 3 --max-time 120 \
            'https://carto-sdis81.tigeo.fr/index.php/lizmap/service?repository=public&project=PEI_Hydraclic&SERVICE=WFS&typeName=pei_hydraclic_v2&VERSION=1.3.0&REQUEST=GetFeature&OutputFormat=geojson' \
            -o pei-tarn.geojson
          curl --fail --location --retry 3 --max-time 120 \
            'https://www.herault-data.fr/api/explore/v2.1/catalog/datasets/points-deau-defense-des-forets-contre-les-incendies-dfci-herault/exports/geojson' \
            -o pei-herault-dfci.geojson
          curl --fail --location --retry 3 --max-time 120 \
            'https://static.data.gouv.fr/resources/points-deau-incendie-de-lagglomeration-du-grand-annecy/20250128-081713/points-eau-incendie-2024.csv' \
            -o pei-annecy.csv
          curl --fail --location --retry 3 --max-time 120 \
            'https://www.pigma.org/fr/dataset/datasets/7554/resource/15478/download/' \
            -o pei-sdis64.geojson
          curl --fail --location --retry 3 --max-time 120 \
            'https://data.tours-metropole.fr/api/explore/v2.1/catalog/datasets/points-d-eau-tours-metropole-val-de-loire/exports/geojson' \
            -o pei-tours.geojson

          mkdir -p /tmp/csp-osm
          boxes=('41,-5.5,44.4,-0.8' '41,-0.8,44.4,3.9' '41,3.9,44.4,8.5' '44.4,-5.5,47.8,-0.8' '44.4,-0.8,47.8,3.9' '44.4,3.9,47.8,8.5' '47.8,-5.5,51.3,-0.8' '47.8,-0.8,51.3,3.9' '47.8,3.9,51.3,8.5')
          for i in "${!boxes[@]}"; do
            curl --fail --location --retry 3 --max-time 120 --get \
              --data-urlencode "data=[out:json][timeout:60];nwr[\"amenity\"=\"fire_station\"](${boxes[$i]});out center tags;" \
              'https://overpass-api.de/api/interpreter' -o "/tmp/csp-osm/$i.json"
          done
          jq -s '{type:"FeatureCollection",features:[.[].elements[] | select(([(.tags.name // ""),(.tags["fire_station:type:FR"] // ""),(.tags.description // "")] | join(" ")) | test("CSP|centre de secours principal"; "i")) | (.lat // .center.lat) as $lat | (.lon // .center.lon) as $lon | select($lat != null and $lon != null) | {type:"Feature",geometry:{type:"Point",coordinates:[$lon,$lat]},properties:(.tags // {})}]}' /tmp/csp-osm/*.json > csp-france.geojson

      - name: Publier les changements
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add csp-france.geojson csp-doubs.geojson pei-rennes.geojson pei-tarn.geojson pei-herault-dfci.geojson pei-annecy.csv pei-sdis64.geojson pei-tours.geojson
          git diff --cached --quiet || git commit -m 'Actualiser les donnees CSP et PEI'
          git push
